{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 animate-fade-up">
        <div class="muni-card muni-card-accent">
            <h5 class="fw-bold mb-3" style="color: var(--muni-granate);">{{ titulo }}</h5>
            
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    {% for field in form %}
                    <div class="col-md-{% if field.name == 'descripcion' or field.name == 'responsables' %}12{% else %}6{% endif %}">
                        <label class="form-label small fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <small class="text-danger">{{ field.errors.0 }}</small>
                        {% endif %}
                    </div>
                    {% endfor %}
                </div>
                <div class="mt-4 text-end">
                    <a href="{% url url_cancelar %}" class="btn btn-light me-2">Cancelar</a>
                    <button type="submit" class="btn-muni">Guardar Registro</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
